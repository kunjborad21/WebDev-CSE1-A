<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background-color: #f2f2f2;
  color: #222;
}

body.dark-theme {
  background-color: #1a1a1a;
  color: #eee;
}

body.dark-theme main {
  background-color: #2b2b2b;
}

body.dark-theme .modal-box {
  background-color: #3a3a3a;
  color: #eee;
}

header {
  background-color: #333;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

#hamburger {
  display: none;
  background: none;
  border: 1px solid white;
  color: white;
  font-size: 20px;
  padding: 4px 10px;
  cursor: pointer;
}

#themeToggle {
  background: none;
  border: 1px solid white;
  color: white;
  font-size: 16px;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 4px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  margin-right: 10px;
}

main {
  background-color: white;
  padding: 20px;
  margin: 20px;
}

#greeting {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.profile-details p {
  margin: 6px 0;
}

#openModalBtn {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
  cursor: pointer;
  border-radius: 4px;
  margin-top: 20px;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.modal-box {
  background-color: white;
  padding: 25px;
  border-radius: 6px;
  max-width: 400px;
  width: 90%;
}

.modal-box form {
  display: flex;
  flex-direction: column;
}

.modal-box button {
  margin-top: 15px;
  background-color: #333;
  color: white;
  border: none;
  padding: 6px 14px;
  cursor: pointer;
  border-radius: 4px;
}

input {
  display: block;
  margin-bottom: 10px;
  padding: 5px;
}

input[type="submit"] {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
}

footer {
  text-align: center;
  padding: 10px;
  background-color: #333;
  color: white;
}

@media (max-width: 768px) {
  header {
    padding: 10px;
  }
  main {
    margin: 10px;
    padding: 15px;
  }
}

@media (max-width: 480px) {
  header h1 {
    font-size: 20px;
  }
  .profile-card {
    flex-direction: column;
    text-align: center;
  }

  #hamburger {
    display: inline-block;
  }

  nav {
    display: none;
    width: 100%;
    flex-direction: column;
    margin-top: 10px;
  }

  nav.nav-open {
    display: flex;
  }
}
</style>
</head>

<body>

<header>
<div class="header-left">
<button id="hamburger">&#9776;</button>
<h1>Student Profile</h1>
</div>
<button id="themeToggle">Dark Mode</button>
</header>

<nav id="navMenu">
<a href="index.html">Home</a>
</nav>

<main>
<p id="greeting"></p>

<div class="profile-card">
<img src="C:\Users\Administrator\OneDrive\Desktop\WDF\image\shreyansh clg photo.jpg" alt="Student Photo" class="avatar">
<div class="profile-details">
<p><strong>Name :</strong> Shreyansh Kavad</p>
<p><strong>Roll No :</strong> 25CE045</p>
<p><strong>Course :</strong> B.Tech Computer Engineering</p>
<p><strong>Semester :</strong> 3</p>
<p><strong>Email :</strong> shreyanshkavad9801@gmail.com</p>
<p><strong>Phone :</strong> +91 8758694952</p>
</div>
</div>

<button id="openModalBtn">Edit Profile</button>
</main>

<div class="modal-overlay" id="editModal">
<div class="modal-box">
<h2>Edit Profile</h2>
<form id="editForm">
<label>Name</label>
<input type="text" value="Shreyansh Kavad">

<label>Email</label>
<input type="email" value="shreyanshkavad9801@gmail.com">

<label>Phone</label>
<input type="tel" value="+91 8758694952">

<input type="submit" value="Save">
</form>
<button id="closeModalBtn">Close</button>
</div>
</div>

<footer>
<hr>
<p>Student Hub</p>
</footer>

<script>
/* ---------- Hamburger menu ---------- */
let hamburger = document.getElementById("hamburger");
let navMenu = document.getElementById("navMenu");

hamburger.addEventListener("click", function() {
  navMenu.classList.toggle("nav-open");
});

/* ---------- Light / Dark theme switcher (remembered using localStorage) ---------- */
let themeBtn = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-theme");
  themeBtn.textContent = "Light Mode";
}

themeBtn.addEventListener("click", function() {
  document.body.classList.toggle("dark-theme");

  if (document.body.classList.contains("dark-theme")) {
    localStorage.setItem("theme", "dark");
    themeBtn.textContent = "Light Mode";
  } else {
    localStorage.setItem("theme", "light");
    themeBtn.textContent = "Dark Mode";
  }
});

/* ---------- Edit Profile modal ---------- */
let modal = document.getElementById("editModal");
let openModalBtn = document.getElementById("openModalBtn");
let closeModalBtn = document.getElementById("closeModalBtn");

openModalBtn.addEventListener("click", function() {
  modal.style.display = "flex";
});

closeModalBtn.addEventListener("click", function() {
  modal.style.display = "none";
});

modal.addEventListener("click", function(event) {
  if (event.target === modal) {
    modal.style.display = "none";
  }
});

// This is a demo form only (no real server), so just close the modal on save
document.getElementById("editForm").addEventListener("submit", function(event) {
  event.preventDefault();
  alert("Profile changes saved (demo only).");
  modal.style.display = "none";
});

/* ---------- Greeting message ---------- */
let studentName = "Shreyansh Kavad";
let greetingMessage = "Welcome, " + studentName + "!";
document.getElementById("greeting").textContent = greetingMessage;
</script>

</body>
</html>
