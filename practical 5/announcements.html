<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background-color: #f2f2f2;
  color: #222;
}

body.dark-theme {
  background-color: #1a1a1a;
  color: #eee;
}

body.dark-theme main {
  background-color: #2b2b2b;
}

body.dark-theme main ul li {
  background-color: #3a3a3a;
}

/* This banner kept its light yellow background in dark mode, which made
   the white text on it hard to read. Give it a dark background too. */
body.dark-theme #notifBanner {
  background-color: #4a4423;
  border-color: #7a6a2f;
  color: #eee;
}

header {
  background-color: #333;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

#hamburger {
  display: none;
  background: none;
  border: 1px solid white;
  color: white;
  font-size: 20px;
  padding: 4px 10px;
  cursor: pointer;
}

#themeToggle {
  background: none;
  border: 1px solid white;
  color: white;
  font-size: 16px;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 4px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  margin-right: 10px;
}

main {
  background-color: white;
  padding: 20px;
  margin: 20px;
}

#notifBanner {
  background-color: #fff3cd;
  border: 1px solid #ffe08a;
  padding: 12px 15px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#closeBanner {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}

main ul {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

main ul li {
  background-color: #f2f2f2;
  border-radius: 5px;
  padding: 12px 15px;
}

input {
  display: block;
  margin-bottom: 10px;
  padding: 5px;
}

input[type="submit"] {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
}

footer {
  text-align: center;
  padding: 10px;
  background-color: #333;
  color: white;
}

@media (max-width: 768px) {
  header {
    padding: 10px;
  }
  main {
    margin: 10px;
    padding: 15px;
  }
}

@media (max-width: 480px) {
  header h1 {
    font-size: 20px;
  }

  #hamburger {
    display: inline-block;
  }

  nav {
    display: none;
    width: 100%;
    flex-direction: column;
    margin-top: 10px;
  }

  nav.nav-open {
    display: flex;
  }
}
</style>
</head>

<body>

<header>
<div class="header-left">
<button id="hamburger">&#9776;</button>
<h1>Announcements</h1>
</div>
<button id="themeToggle">Dark Mode</button>
</header>

<nav id="navMenu">
<a href="index.html">Home</a>
</nav>

<main>
<div id="notifBanner">
<span id="bannerText"></span>
<button id="closeBanner">&times;</button>
</div>

<ul>
<li>Semester Exam starts next month.</li>
<li>Assignment submission before deadline.</li>
<li>Holiday on Independence Day.</li>
</ul>
</main>

<footer>
<hr>
<p>Student Hub</p>
</footer>

<script>
/* ---------- Hamburger menu ---------- */
let hamburger = document.getElementById("hamburger");
let navMenu = document.getElementById("navMenu");

hamburger.addEventListener("click", function() {
  navMenu.classList.toggle("nav-open");
});

/* ---------- Light / Dark theme switcher (remembered using localStorage) ---------- */
let themeBtn = document.getElementById("themeToggle");

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-theme");
  themeBtn.textContent = "Light Mode";
}

themeBtn.addEventListener("click", function() {
  document.body.classList.toggle("dark-theme");

  if (document.body.classList.contains("dark-theme")) {
    localStorage.setItem("theme", "dark");
    themeBtn.textContent = "Light Mode";
  } else {
    localStorage.setItem("theme", "light");
    themeBtn.textContent = "Dark Mode";
  }
});

/* ---------- Notification banner with live count ---------- */
let items = document.querySelectorAll("main ul li");
document.getElementById("bannerText").textContent =
  "You have " + items.length + " new announcements!";

let banner = document.getElementById("notifBanner");
let closeBanner = document.getElementById("closeBanner");

closeBanner.addEventListener("click", function() {
  banner.style.display = "none";
});
</script>

</body>
</html>
