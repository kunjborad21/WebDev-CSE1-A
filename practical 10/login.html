<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body { font-family: Arial; margin: 0; background-color: #f2f2f2; color: #222; }
body.dark-theme { background-color: #1a1a1a; color: #eee; }
body.dark-theme main { background-color: #2b2b2b; }
header { background-color: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header-left { display: flex; align-items: center; gap: 15px; }
#hamburger { display: none; background: none; border: 1px solid white; color: white; font-size: 20px; padding: 4px 10px; cursor: pointer; }
#themeToggle { background: none; border: 1px solid white; color: white; font-size: 16px; padding: 4px 10px; cursor: pointer; border-radius: 4px; }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav a { color: white; margin-right: 10px; }
main { background-color: white; padding: 20px; margin: 20px; }
form { display: flex; flex-direction: column; max-width: 400px; margin: 0 auto; }
label { margin-top: 8px; font-weight: bold; }
input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 5px; }
input[type="submit"] { background-color: #333; color: white; border: none; padding: 8px 15px; margin-top: 10px; cursor: pointer; }
.message { max-width: 400px; margin: 0 auto 15px auto; padding: 10px; border-radius: 4px; display: none; }
.message.error { background-color: #f8d7da; color: #721c24; }
.message.info { background-color: #fff3cd; color: #664d03; }
.links { max-width: 400px; margin: 15px auto 0 auto; }
footer { text-align: center; padding: 10px; background-color: #333; color: white; }
@media (max-width: 480px) {
  header h1 { font-size: 20px; }
  form { max-width: 100%; }
  #hamburger { display: inline-block; }
  nav { display: none; width: 100%; flex-direction: column; margin-top: 10px; }
  nav.nav-open { display: flex; }
}
</style>
</head>

<body>

<header>
<div class="header-left">
<button id="hamburger">&#9776;</button>
<h1>Student Login</h1>
</div>
<button id="themeToggle">Dark Mode</button>
</header>

<nav id="navMenu">
<a href="index.html">Home</a>
<a href="register.html">Register</a>
</nav>

<main>

<!-- messages are shown by the script below, based on the address (?error=...) -->
<div class="message error" id="errorMsg"></div>
<div class="message info" id="infoMsg"></div>

<!-- Practical 10: form now submits to login_process.php -->
<form action="login_process.php" method="POST">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>

<label for="password">Password</label>
<input type="password" id="password" name="password" required>

<input type="submit" value="Login">
</form>

<div class="links">
<a href="forgotpasword.html">Forgot Password?</a>
</div>

</main>

<footer>
<hr>
<p>Student Hub</p>
</footer>

<script>
/* hamburger menu */
let hamburger = document.getElementById("hamburger");
let navMenu = document.getElementById("navMenu");
hamburger.addEventListener("click", function() {
  navMenu.classList.toggle("nav-open");
});

/* theme switcher */
let themeBtn = document.getElementById("themeToggle");
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark-theme");
  themeBtn.textContent = "Light Mode";
}
themeBtn.addEventListener("click", function() {
  document.body.classList.toggle("dark-theme");
  if (document.body.classList.contains("dark-theme")) {
    localStorage.setItem("theme", "dark");
    themeBtn.textContent = "Light Mode";
  } else {
    localStorage.setItem("theme", "light");
    themeBtn.textContent = "Dark Mode";
  }
});

/* Practical 10: show a message if PHP sent us back here with ?error=... */
let params = new URLSearchParams(window.location.search);
let errorMsg = document.getElementById("errorMsg");
let infoMsg = document.getElementById("infoMsg");

if (params.get("error") === "wrong") {
  errorMsg.textContent = "Wrong email or password.";
  errorMsg.style.display = "block";
} else if (params.get("error") === "login") {
  errorMsg.textContent = "Please login first to open that page.";
  errorMsg.style.display = "block";
} else if (params.get("timeout") === "1") {
  infoMsg.textContent = "Your session expired. Please login again.";
  infoMsg.style.display = "block";
} else if (params.get("logout") === "1") {
  infoMsg.textContent = "You have been logged out.";
  infoMsg.style.display = "block";
}
</script>

</body>
</html>
