<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notificationBanner" class="notification-banner">
        Welcome to the 🎓 Student Hub! New courses are available.
        <button id="closeBanner" class="close-btn">&times;</button>
    </div>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🎓 Student Hub</a>
            <button id="hamburger" class="hamburger">☰</button>
            <nav>
                <ul id="navMenu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
            <button id="themeToggle" class="theme-toggle">🌙</button>
        </div>
    </header>

    <main>
        <div class="form-card">
            <h2>Contact Us</h2>
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" style="width:100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);"></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Student Hub. CHARUSAT University.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
