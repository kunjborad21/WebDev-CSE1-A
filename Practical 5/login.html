<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notificationBanner" class="notification-banner">
        Welcome to the 🎓 Student Hub! New courses are available.
        <button id="closeBanner" class="close-btn">&times;</button>
    </div>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🎓 Student Hub</a>
            <button id="hamburger" class="hamburger">☰</button>
            <nav>
                <ul id="navMenu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
            <button id="themeToggle" class="theme-toggle">🌙</button>
        </div>
    </header>

    <main>
        <div class="form-card">
            <h2>Login</h2>
            <p>Access your dashboard.</p>
            <br>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p style="margin-top: 1rem; text-align: center;"><a href="forgotpassword.html">Forgot Password?</a></p>
            <p style="margin-top: 1rem; text-align: center;">Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="color: var(--success-color);">Success!</h2>
            <p id="modalMessage">Login Successful!</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Student Hub. CHARUSAT University.</p>
    </footer>

    <script src="script.js"></script>
    <script src="validate.js"></script>
</body>
</html>
