<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background-color: #f2f2f2;
}

header {
  background-color: #333;
  color: white;
  padding: 15px;
}

/* nav uses flexbox so the links wrap on small screens */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  margin-right: 10px;
}

main {
  background-color: white;
  padding: 20px;
  margin: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

/* each assignment card grows to fill space but never shrinks below 220px */
article {
  background-color: #f2f2f2;
  border-radius: 5px;
  padding: 15px;
  flex: 1 1 220px;
}

/* Tablet screens */
@media (max-width: 768px) {
  header {
    padding: 10px;
  }
  main {
    margin: 10px;
    padding: 15px;
  }
}

/* Mobile screens: cards stack in a single column */
@media (max-width: 480px) {
  header h1 {
    font-size: 20px;
  }
  main {
    flex-direction: column;
  }
}

input {
  display: block;
  margin-bottom: 10px;
  padding: 5px;
}

input[type="submit"] {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
}

footer {
  text-align: center;
  padding: 10px;
  background-color: #333;
  color: white;
}
</style>
</head>

<body>

<header>
<h1>Assignments</h1>
<nav>
<a href="index.html">Home</a>
</nav>
</header>

<main>
<article>
<h2>Web Development</h2>
<p>Submission Date : 10 August</p>
</article>

<article>
<h2>DSA</h2>
<p>Submission Date : 15 August</p>
</article>
</main>

<footer>
<hr>
<p>Student Hub</p>
</footer>

</body>
</html>
