<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background-color: #f2f2f2;
}

header {
  background-color: #333;
  color: white;
  padding: 15px;
}

/* nav uses flexbox so the links wrap on small screens */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  margin-right: 10px;
}

main {
  background-color: white;
  padding: 20px;
  margin: 20px;
}

/* form uses flexbox to stack fields and stay centered on wide screens */
form {
  display: flex;
  flex-direction: column;
  max-width: 400px;
  margin: 0 auto;
}

input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 10px;
  padding: 5px;
}

/* Tablet screens */
@media (max-width: 768px) {
  header {
    padding: 10px;
  }
  main {
    margin: 10px;
    padding: 15px;
  }
}

/* Mobile screens */
@media (max-width: 480px) {
  header h1 {
    font-size: 20px;
  }
  form {
    max-width: 100%;
  }
}

input[type="submit"] {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
}

footer {
  text-align: center;
  padding: 10px;
  background-color: #333;
  color: white;
}
</style>
</head>

<body>

<header>
<h1>Forgot Password</h1>
<nav>
<a href="login.html">Back to Login</a>
</nav>
</header>

<main>
<form>
<label>Enter Email</label>
<input type="email">
<input type="submit" value="Reset Password">
</form>
</main>

<footer>
<hr>
<p>Student Hub</p>
</footer>

</body>
</html>
