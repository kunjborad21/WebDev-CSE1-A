<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<style>
body {
  font-family: Arial;
  margin: 0;
  background-color: #f2f2f2;
}

header {
  background-color: #333;
  color: white;
  padding: 15px;
}

/* nav uses flexbox so links wrap nicely on small screens */
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

nav a {
  color: white;
  margin-right: 10px;
}

main {
  background-color: white;
  padding: 20px;
  margin: 20px;
}

/* profile card uses flexbox: photo box + details side by side */
.profile-card {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background-color: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 14px;
  flex-shrink: 0;
}

.profile-details p {
  margin: 6px 0;
}

input {
  display: block;
  margin-bottom: 10px;
  padding: 5px;
}

input[type="submit"] {
  background-color: #333;
  color: white;
  border: none;
  padding: 8px 15px;
}

footer {
  text-align: center;
  padding: 10px;
  background-color: #333;
  color: white;
}

/* Tablet screens */
@media (max-width: 768px) {
  header {
    padding: 10px;
  }
  main {
    margin: 10px;
    padding: 15px;
  }
}

/* Mobile screens: stack the avatar above the details */
@media (max-width: 480px) {
  header h1 {
    font-size: 20px;
  }
  .profile-card {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>

<header>
<h1>Student Profile</h1>
<nav>
<a href="index.html">Home</a>
</nav>
</header>

</html>
