<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 🎓 Student Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🎓 Student Hub</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="attendance.html">Attendance</a>
            <a href="fees.html">Fees</a>
            <a href="assignment.html">Assignments</a>
            <a href="announcements.html">Announcements</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>
    
    <main class="container">
        <div class="form-container">
            <h2>Student Registration</h2>
            <form action="login.html" method="GET">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input type="email" id="email" name="email" required placeholder="example@charusat.edu.in">
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" required placeholder="1234567890">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn btn-full">Register</button>
            </form>
            <div class="form-links">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Student Hub - CHARUSAT University</p>
    </footer>
</body>
</html>
